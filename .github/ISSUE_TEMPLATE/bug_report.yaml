name: Bug report
description: Report incorrect behavior in the authorization server or tooling
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not include passwords, client secrets, refresh tokens, or `.env` contents.**

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Cloud Run staging
        - Cloud Run production
        - CI only
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit SHA or image tag (if known)
    validations:
      required: false
