name: CI Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  pr_target_checker:
    name: PR target branch checker
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR targets main
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event (${{ github.event_name }}): branch checker passes."
            exit 0
          fi

          echo "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }}"

          if [ "${{ github.event.pull_request.base.ref }}" != "main" ]; then
            echo "Pull requests must target the main branch."
            exit 1
          fi

  package_checks:
    name: Package checks & Typecheck
    needs: [pr_target_checker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

  unit_tests:
    name: Unit tests
    needs: [pr_target_checker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage

  integration_tests:
    name: Integration tests
    needs: [pr_target_checker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-pull Mongo image for Testcontainers
        run: docker pull mongo:7

      - name: Run integration tests (Testcontainers Mongo)
        run: pnpm test:integration
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

  build_check:
    name: Next.js Production Build
    needs: [pr_target_checker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Next.js build
        run: pnpm build

  pr_image_build:
    name: Build image on PR
    needs: [pr_target_checker]
    if: github.event_name == 'pull_request'
    uses: pesu-dev/actions/.github/workflows/build_push_image.yml@v1
    with:
      image_tag: ${{ github.event.pull_request.head.sha }}
      push: false

  greenlight:
    name: Greenlight - CI checks
    needs:
      - pr_target_checker
      - package_checks
      - unit_tests
      - integration_tests
      - build_check
      - pr_image_build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect CI check statuses
        env:
          CHECK_RESULTS: >-
            pr_target_checker=${{ needs.pr_target_checker.result }}
            package_checks=${{ needs.package_checks.result }}
            unit_tests=${{ needs.unit_tests.result }}
            integration_tests=${{ needs.integration_tests.result }}
            build_check=${{ needs.build_check.result }}
            pr_image_build=${{ needs.pr_image_build.result }}
        run: |
          set -euo pipefail

          failed=0
          echo "CI check statuses:"
          for entry in $CHECK_RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            echo "  - ${name}: ${result}"

            case "${result}" in
              success|skipped)
                ;;
              failure|cancelled)
                failed=1
                ;;
              *)
                echo "Unexpected result for ${name}: ${result}"
                failed=1
                ;;
            esac
          done

          if [ "${failed}" -ne 0 ]; then
            echo "greenlight failed: one or more CI checks did not pass."
            exit 1
          fi

          echo "greenlight passed: all CI checks are clear."
