# Local MongoDB for `pnpm dev`: a single-node replica set, because transactions
# (consent, refresh rotation, settings) require one.
#
#   docker compose up -d --wait      # then use MONGODB_URI from .env.example
#   docker compose down              # add -v to wipe the data

services:
  mongo:
    # Same major version as the Testcontainers suite and CI.
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      # Loopback only: this Mongo has no authentication.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot; afterwards just reports status.
      # The member advertises 127.0.0.1 so drivers on the host can reach the primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20

volumes:
  mongo-data:
