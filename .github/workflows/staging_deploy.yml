name: Staging Deploy

on:
  workflow_run:
    workflows:
      - CI Checks
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write

env:
  SHA_TAG: ${{ github.event.workflow_run.head_sha }}
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: staging_deploy
  cancel-in-progress: false

jobs:
  build_and_push_image:
    name: Build and push commit image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/build_and_push_image.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      image_tag: ${{ github.event.workflow_run.head_sha }}
      push: true

  deploy_staging:
    name: Deploy to Cloud Run staging
    needs: [build_and_push_image]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE_STAGING }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          flags: >-
            --timeout=60
            --port=8080
            --allow-unauthenticated

  tag_staging:
    name: Tag deployed image as staging
    needs: [deploy_staging]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag commit image as staging
        run: |
          docker pull "${IMAGE}:${SHA_TAG}"
          docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:staging"
          docker push "${IMAGE}:staging"
