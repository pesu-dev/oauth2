name: Staging Deploy

on:
  workflow_run:
    workflows:
      - CI Checks
    types:
      - completed

permissions:
  contents: read
  packages: write
  id-token: write

env:
  SHA_TAG: ${{ github.event.workflow_run.head_sha }}
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: staging_deploy
  cancel-in-progress: false

jobs:
  build_and_push_image:
    name: Build and push commit image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/build_and_push_image.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      image_tag: ${{ github.event.workflow_run.head_sha }}
      push: true

  deploy_staging:
    name: Deploy to Cloud Run staging
    needs: [build_and_push_image]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/deploy_cloudrun.yml
    with:
      environment: staging
      service: ${{ vars.CLOUD_RUN_SERVICE_STAGING }}
      image: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
      app_env: staging
    permissions:
      contents: read
      id-token: write

  tag_staging:
    name: Tag deployed image as staging
    needs: [deploy_staging]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag commit image as staging
        run: |
          docker pull "${IMAGE}:${SHA_TAG}"
          docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:staging"
          docker push "${IMAGE}:staging"

  cleanup_ghcr:
    name: Cleanup old package versions in GHCR
    needs: [tag_staging]
    uses: ./.github/workflows/ghcr_cleanup.yml
    with:
      keep_sha_tags: 20
