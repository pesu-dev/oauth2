name: Feature request
description: Suggest an enhancement aligned with the approved design spec
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Check the approved [design spec](../../docs/superpowers/specs/2026-09-03-oidc-authorization-server-design.md) and [MVP plan](../../docs/superpowers/plans/2026-09-04-oidc-authorization-server-mvp.md) first. `docs/plans/*` is historical/outdated.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user or developer need does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits v1 (identity OIDC, developer portal, consent)
        - label: This is explicitly v2+ (2FA, analytics, etc.)
        - label: This requires an architecture decision (ADR)
