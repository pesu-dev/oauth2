# Local stack: the production image + a single-node Mongo replica set.
# Transactions (consent, refresh rotation, settings) require a replica set.
#
#   docker compose up --build        # app on http://localhost:8080
#   docker compose up mongo          # Mongo only, for `pnpm dev` (see README)

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot; afterwards just reports status.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      ISSUER_URL: http://localhost:8080
      # Local-only fallback so delegated consent works out of the box; set a real value in .env.
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-local-dev-only-vault-master-key}
      ACADEMY_MENU_IDS: ${ACADEMY_MENU_IDS:-}
    depends_on:
      mongo:
        condition: service_healthy

  # Node + pnpm toolbox over the bind-mounted source (no host Node needed):
  #   docker compose run --rm tools pnpm test:unit
  #   docker compose run --rm tools node scripts/seed_client.mjs
  tools:
    build:
      context: .
      target: deps
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      # Keep pnpm on the image's store so add/remove works over the bind mount.
      npm_config_store_dir: /root/.local/share/pnpm/store/v10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
